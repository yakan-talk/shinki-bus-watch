name: ShinkiBusWatch
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  WatchHostApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOSHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.mywatchapp
        PRODUCT_NAME: WatchHostApp
        INFOPLIST_KEY_CFBundleDisplayName: ShinkiBusWatch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: NO
    dependencies:
      - target: MyWatchApp
        embed: true

  MyWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.mywatchapp.watchkitapp
        PRODUCT_NAME: MyWatchApp
        INFOPLIST_KEY_CFBundleDisplayName: "神姫バス"
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.local.mywatchapp
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

schemes:
  WatchHostApp:
    build:
      targets:
        WatchHostApp: all
    archive:
      config: Release
